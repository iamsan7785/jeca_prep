version: "3.8"
services:
  backend:
    image: "your-registry/jeca-backend:latest"
    env_file:
      - .env.prod
    ports:
      - "4000:4000"
    depends_on:
      - db
    restart: always

  frontend:
    image: "your-registry/jeca-frontend:latest"
    ports:
      - "80:80"
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: jeca_prep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db-data:
